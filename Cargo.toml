[workspace]
resolver = "3"
members = [
    "crates/admiral-model",
    "crates/admiral-config",
    "crates/admiral-store",
    "crates/admiral-scan",
    "crates/admiral-adapter",
    "crates/admiral-validate",
    "crates/admiral-runtime",
    "crates/admiral-decider",
    "crates/admiral-cli",
    "crates/admiral-tui",
    "crates/admiral-lifecycle",
    "crates/admiral-board",
    "crates/admiral-dashboard",
    "crates/admiral-observe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
toml = "0.9"
