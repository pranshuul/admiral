[package]
name = "admiral-harness"
description = "The scripted-agent harness: plays the agent role against a runtime from a scenario file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "admiral-harness"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd.workspace = true

[lints]
workspace = true
